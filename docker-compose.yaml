services:
  garage:
    image: dxflrs/garage:v2.1.0
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - '3900:3900' # S3 API
      - '3902:3902' # Web (public bucket access)
      - '3903:3903' # Admin API
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    depends_on:
      - garage
    restart: unless-stopped

volumes:
  garage-meta:
  garage-data:
